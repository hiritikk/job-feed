# Alert rules, evaluated only against NEW jobs. See spec §7.
- name: core
  countries: [CA]            # includes remote roles whose remoteRegions include CA or are empty
  remote_ok: true
  levels: [new-grad, early-career]
  grad_years: [2027, null]
  role_types: [sde, ml-ai, backend, fullstack, infra, data]
  tiers: [1, 2]
  exclude_work_auth: [restricted]
  max_years: 1               # a posting asking for 2 or more years is skipped; unstated experience still matches
  priority: { 1: high, 2: default }

# Plain titles ("Software Engineer", no new-grad wording) at tier 1-2 companies in Canada. Quieter than the rule above, and
# skipped when the posting asks for more than 1 year of experience.
- name: plain-title-top-companies
  countries: [CA]
  remote_ok: true
  levels: [other]
  grad_years: [2027, null]
  role_types: [sde, ml-ai, backend, fullstack, infra, data]
  tiers: [1, 2]
  exclude_work_auth: [restricted]
  max_years: 1
  priority: { 1: default, 2: default }

# Postings at the same companies that the keyword rules above turn away because of a number in the text (a "3 years"
# that is not a requirement, a different class year) but that JEV, reading the whole posting, judges new-grad or early-career, open to your graduation date, and rates 0.65 or more. In the
# first 400 real ratings (2026-11-17) the best scored 0.72 and 0.65 kept the clear new-grad roles in Canada (5 of 400). Only rated postings can
# match, so this rule is silent unless OPENROUTER_API_KEY is set.
- name: high-fit
  countries: [CA]
  remote_ok: true
  levels: [new-grad, early-career, other]
  grad_years: [2026, 2027, 2028, null]   # JEV checks the graduation window itself
  role_types: [sde, ml-ai, backend, fullstack, infra, data]
  tiers: [1, 2]              # add 3 to also hear about strong fits at smaller companies
  exclude_work_auth: [restricted]
  min_fit: 0.65
  priority: { 1: default, 2: default }
