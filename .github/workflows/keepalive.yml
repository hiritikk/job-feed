name: keepalive

# GitHub disables scheduled workflows on public repos after 60 days without repository activity.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "job-feed bot"
          git config user.email "job-feed@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
